name: daily-stock-signal

on:
  schedule:
    # UTC 22:00 = 日本時間 翌朝7:00（日〜木のUTC = 月〜金のJSTに実行）
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}   # 手動実行ボタンも有効化（テスト用）

permissions:
  contents: write         # レポートファイルをリポジトリにコミットするための権限

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          # none = レポートファイルのみ(Claudeスケジュールタスク連携) / email / discord / both
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'none' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit report
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest_report.md
          git diff --cached --quiet || git commit -m "daily report $(date -u +%Y-%m-%d)"
          git push
